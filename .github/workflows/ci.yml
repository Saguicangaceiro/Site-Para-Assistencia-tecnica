name: Python Flask CI and Docker Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout atualizado para @v4.3.0+ (ou você pode usar @main para pegar a última)
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    # 2. Setup Python atualizado para @v5.3.0+ (garantindo compatibilidade)
    - name: Set up Python
      uses: actions/setup-python@v5.3.0
      with:
        python-version: '3.10'

    # 3. Cache atualizado para @v4.2.0+
    - name: Cache pip
      uses: actions/cache@v4.2.0
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # 4. Instala as dependências do seu projeto Flask
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # 5. Verifica se há erros de sintaxe ou padrões ruins de código
    - name: Lint with flake8
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  docker-test:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4.2.2

    # 6. Tenta construir a sua imagem Docker para validar se o seu dockerfile está saudável
    - name: Build Docker Image
      run: |
        docker build -t site-assistencia:latest .
